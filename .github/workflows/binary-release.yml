name: Build Release Artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, with or without a leading v'
        required: false
        default: '1.0.5'
      enable_upx:
        description: 'Enable UPX compression for Linux runtime binaries (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vars:
    name: Prepare release variables
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      buildtime: ${{ steps.vars.outputs.buildtime }}
      enable_upx: ${{ steps.vars.outputs.enable_upx }}
    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v4

      - name: Normalize version
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          else
            RAW_VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' desktop/package.json | head -n 1)"
          fi
          if [[ -z "${RAW_VERSION}" ]]; then
            RAW_VERSION="1.0.5"
          fi
          VERSION="${RAW_VERSION#v}"
          TAG="v${VERSION}"
          BUILDTIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ENABLE_UPX_RAW="${{ github.event.inputs.enable_upx || 'false' }}"
          case "${ENABLE_UPX_RAW}" in
            true|1|yes|on) ENABLE_UPX=1 ;;
            *) ENABLE_UPX=0 ;;
          esac
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "buildtime=${BUILDTIME}" >> "${GITHUB_OUTPUT}"
          echo "enable_upx=${ENABLE_UPX}" >> "${GITHUB_OUTPUT}"

  frontend:
    name: Build embedded Web UI
    runs-on: ubuntu-latest
    needs: vars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend assets
        shell: bash
        run: |
          npm ci --prefix web
          npm run build:check --prefix web

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Build Linux runtime ${{ matrix.artifact_arch }}
    runs-on: ubuntu-latest
    needs:
      - vars
      - frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ''
            artifact_arch: amd64
          - goarch: arm64
            goarm: ''
            artifact_arch: arm64
          - goarch: arm
            goarm: '7'
            artifact_arch: armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Sync frontend dist for embed
        shell: bash
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web
          cp -R web/dist internal/web/dist

      - name: Build Linux runtime
        shell: bash
        run: |
          mkdir -p dist out
          GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
            go build -trimpath -buildvcs=false -tags "with_utls nomsgpack" \
            -ldflags "-s -w -X 'github.com/swordstudiox/vohive-plus/internal/global.Version=${{ needs.vars.outputs.version }}' -X 'github.com/swordstudiox/vohive-plus/internal/global.BuildTime=${{ needs.vars.outputs.buildtime }}'" \
            -o dist/vohive ./cmd/vohive

      - name: Install UPX
        if: ${{ needs.vars.outputs.enable_upx == '1' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: Compress with UPX
        if: ${{ needs.vars.outputs.enable_upx == '1' }}
        shell: bash
        run: |
          upx --best --lzma dist/vohive || upx -9 dist/vohive

      - name: Package Linux runtime
        shell: bash
        run: |
          OUT="vohive-plus-firmware_${{ needs.vars.outputs.version }}_linux_${{ matrix.artifact_arch }}"
          cp dist/vohive "out/${OUT}"
          sha256sum "out/${OUT}" > "out/${OUT}.sha256"

      - name: Upload Linux runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.artifact_arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  desktop-windows:
    name: Build Windows desktop portable package
    runs-on: windows-latest
    needs:
      - vars
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update desktop app version
        shell: pwsh
        run: |
          $version = "${{ needs.vars.outputs.version }}"
          $packagePath = "desktop\package.json"
          $tauriPath = "desktop\src-tauri\tauri.conf.json"
          $cargoTomlPath = "desktop\src-tauri\Cargo.toml"
          $cargoLockPath = "desktop\src-tauri\Cargo.lock"

          $packageJson = Get-Content -Raw -LiteralPath $packagePath | ConvertFrom-Json
          $packageJson.version = $version
          $packageJson | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $packagePath -Encoding utf8

          $tauriJson = Get-Content -Raw -LiteralPath $tauriPath | ConvertFrom-Json
          $tauriJson.version = $version
          $tauriJson.app.windows[0].title = "VoHive Plus v$version"
          $tauriJson | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $tauriPath -Encoding utf8

          $cargoToml = Get-Content -LiteralPath $cargoTomlPath
          $inPackageSection = $false
          for ($i = 0; $i -lt $cargoToml.Count; $i++) {
            if ($cargoToml[$i] -match '^\s*\[package\]\s*$') {
              $inPackageSection = $true
              continue
            }
            if ($cargoToml[$i] -match '^\s*\[') {
              $inPackageSection = $false
            }
            if ($inPackageSection -and $cargoToml[$i] -match '^\s*version\s*=') {
              $cargoToml[$i] = "version = `"$version`""
              $inPackageSection = $false
            }
          }
          Set-Content -LiteralPath $cargoTomlPath -Value $cargoToml -Encoding utf8

          $cargoLock = Get-Content -LiteralPath $cargoLockPath
          $inDesktopPackage = $false
          for ($i = 0; $i -lt $cargoLock.Count; $i++) {
            if ($cargoLock[$i] -eq '[[package]]') {
              $inDesktopPackage = $false
              continue
            }
            if ($cargoLock[$i] -eq 'name = "vohive-plus-desktop"') {
              $inDesktopPackage = $true
              continue
            }
            if ($inDesktopPackage -and $cargoLock[$i] -match '^version = ') {
              $cargoLock[$i] = "version = `"$version`""
              $inDesktopPackage = $false
            }
          }
          Set-Content -LiteralPath $cargoLockPath -Value $cargoLock -Encoding utf8

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download amd64 Linux runtime for desktop resources
        uses: actions/download-artifact@v4
        with:
          name: firmware-amd64
          path: desktop/ci-artifacts/firmware

      - name: Copy embedded Linux runtime
        working-directory: desktop
        shell: pwsh
        run: |
          $version = "${{ needs.vars.outputs.version }}"
          $source = "ci-artifacts\firmware\vohive-plus-firmware_${version}_linux_amd64"
          if (!(Test-Path -LiteralPath $source)) {
            throw "Missing amd64 Linux runtime artifact: $source"
          }
          Copy-Item -LiteralPath $source -Destination "src-tauri\resources\vohive\vohive-open_linux_amd64" -Force

      - name: Install desktop dependencies
        working-directory: desktop
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        working-directory: desktop
        shell: pwsh
        run: pnpm tauri build

      - name: Package portable desktop zip
        working-directory: desktop
        shell: pwsh
        run: |
          $version = "${{ needs.vars.outputs.version }}"
          $package = "vohive-plus-desktop_${version}_windows_x64"
          $root = Join-Path $PWD "out\$package"
          $exe = "src-tauri\target\release\vohive-plus-desktop.exe"
          $resourceSource = "src-tauri\target\release\resources\vohive"
          if (!(Test-Path -LiteralPath $exe)) {
            throw "Missing desktop executable: $exe"
          }
          if (!(Test-Path -LiteralPath $resourceSource)) {
            $resourceSource = "src-tauri\resources\vohive"
          }
          New-Item -ItemType Directory -Force -Path "$root\resources\vohive" | Out-Null
          Copy-Item -LiteralPath $exe -Destination $root -Force
          Copy-Item -Path "$resourceSource\*" -Destination "$root\resources\vohive" -Recurse -Force
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -LiteralPath (Get-ChildItem -LiteralPath $root).FullName -DestinationPath "out\$package.zip" -Force
          $zip = "out\$package.zip"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Path "$zip.sha256" -NoNewline -Encoding ascii

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            desktop/out/*.zip
            desktop/out/*.sha256
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - vars
      - backend
      - desktop-windows
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download Linux runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Select release notes
        id: notes
        shell: bash
        run: |
          NOTES=".github/release-notes/${{ needs.vars.outputs.tag }}.md"
          if [[ -f "${NOTES}" ]]; then
            echo "body_path=${NOTES}" >> "${GITHUB_OUTPUT}"
          else
            FALLBACK="dist/release-notes-${{ needs.vars.outputs.tag }}.md"
            printf '%s\n' \
              '# VoHive Plus Release' \
              '' \
              '本次发布没有找到对应的 `.github/release-notes/版本.md` 文件，已使用自动兜底说明。请在后续发布前补充版本发布说明。' \
              > "${FALLBACK}"
            echo "body_path=${FALLBACK}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VoHive Plus ${{ needs.vars.outputs.version }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
