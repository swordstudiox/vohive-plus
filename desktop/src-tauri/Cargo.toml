[package]
name = "vohive-plus-desktop"
version = "1.0.2"
description = "VoHive Plus Windows desktop shell"
authors = ["VoHive Plus"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[lib]
name = "vohive_plus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
